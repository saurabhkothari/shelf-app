<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf – Book Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b5532a">
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.0/dist/iife/reader/index.js"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mut:#8a8178;--acc:#b5532a;--line:#e8e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--ink:#f1ebe3;--mut:#a39a8f;--acc:#e07b4f;--line:#3a3532}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--ink:#f1ebe3;--mut:#a39a8f;--acc:#e07b4f;--line:#3a3532}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 26px Georgia,serif;margin:0 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.book b{display:block}.meta{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:6px 6px 0 0}
.x{float:right;background:none;color:var(--mut);padding:0 4px;font-size:20px}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.note{color:var(--mut);font-size:13px;margin:4px 0 8px}
#scanBtn{width:100%;font-size:21px;padding:20px;border-radius:14px}
.lnk{display:block;text-align:center;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--acc);font-weight:600;text-decoration:none;margin-bottom:8px}
.lnk[hidden]{display:none}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<main>
<h1>📚 Shelf</h1>
<div class="sub" id="count"></div>

<div class="panel">
  <button id="scanBtn">📷 Scan a book</button>
  <div class="row" style="margin-top:8px"><button class="sec" id="photoBtn">📸 Photo scan</button><button class="sec" id="addBtn">＋ Type it in</button></div>
  <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  <div id="reader" hidden style="margin-top:10px"><video id="vid" playsinline muted style="width:100%;border-radius:12px;background:#000"></video></div>
  <div id="msg" class="note"></div>
  <div id="form" hidden>
    <input id="isbn" placeholder="ISBN" inputmode="numeric">
    <a id="webLook" class="lnk" href="#" target="_blank" rel="noopener" hidden>🔎 Look up this ISBN on ISBNsearch.org</a>
    <input id="title" placeholder="Title">
    <button class="sec" id="pasteT" style="width:100%;margin-bottom:8px">📋 Paste copied title</button>
    <input id="author" placeholder="Author">
    <div class="row">
      <input id="cat" list="cats" placeholder="Category">
      <select id="status"><option>Unread</option><option>Reading</option><option>Read</option></select>
    </div>
    <datalist id="cats"></datalist>
    <div class="row"><button id="save">Save book</button><button class="sec" id="cancel">Cancel</button></div>
  </div>
</div>

<input id="q" placeholder="Search title, author or ISBN">
<div class="chips" id="catChips"></div>
<div class="chips" id="stChips"></div>
<div id="list"></div>
<div class="row" style="margin-top:12px"><button class="sec" id="exp">Export JSON</button></div>
</main>

<script>
let books=[],fCat='All',fSt='All',scanner=null;
const $=id=>document.getElementById(id);
try{books=JSON.parse(localStorage.getItem('shelf-books')||'[]')}catch(e){books=[]}
const persist=()=>{try{localStorage.setItem('shelf-books',JSON.stringify(books))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function validIsbn(s){s=s.replace(/[-\s]/g,'');
  if(/^\d{13}$/.test(s)){let t=0;for(let i=0;i<12;i++)t+=s[i]*(i%2?3:1);return (10-t%10)%10==s[12]}
  if(/^\d{9}[\dX]$/.test(s)){let t=0;for(let i=0;i<10;i++)t+=(s[i]=='X'?10:+s[i])*(10-i);return t%11==0}
  return false}

function toIsbn10(i){if(!/^978\d{10}$/.test(i))return null;const d=i.slice(3,12);let t=0;for(let k=0;k<9;k++)t+=(10-k)*d[k];const c=(11-t%11)%11;return d+(c==10?'X':c)}
async function lookup(isbn){
  const ctl=new AbortController(),o={signal:ctl.signal},i10=toIsbn10(isbn),ids=[isbn,i10].filter(Boolean);
  const J=u=>fetch(u,o).then(r=>r.ok?r.json():null).catch(()=>null);
  const arr=x=>Array.isArray(x)?x:(x?[x]:[]);
  const mk=(t,a,c)=>t?{title:String(t).trim(),author:String(a||'').trim(),cat:arr(c).map(x=>typeof x==='string'?x:x&&x.name).find(cleanCat)||''}:null;
  const S=[
    async()=>{const j=await J('https://openlibrary.org/api/books?bibkeys='+ids.map(i=>'ISBN:'+i).join(',')+'&format=json&jscmd=data');if(!j)return null;for(const k in j){const d=j[k];if(d&&d.title)return mk(d.title+(d.subtitle?': '+d.subtitle:''),(d.authors||[]).map(a=>a.name).join(', '),d.subjects)}return null},
    ...ids.map(i=>async()=>{const j=await J('https://www.googleapis.com/books/v1/volumes?q=isbn:'+i);const v=j&&j.items&&j.items[0]&&j.items[0].volumeInfo;return v&&v.title?mk(v.title+(v.subtitle?': '+v.subtitle:''),arr(v.authors).join(', '),v.categories):null}),
    ...ids.map(i=>async()=>{const j=await J('https://openlibrary.org/search.json?isbn='+i+'&fields=title,author_name,subject&limit=1');const d=j&&j.docs&&j.docs[0];return d?mk(d.title,arr(d.author_name).join(', '),d.subject):null}),
    ...ids.map(i=>async()=>{const j=await J('https://openlibrary.org/isbn/'+i+'.json');return j&&j.title?mk(j.title+(j.subtitle?': '+j.subtitle:''),String(j.by_statement||'').replace(/\.$/,''),j.subjects):null}),
    ...ids.map(i=>async()=>{const j=await J('https://archive.org/advancedsearch.php?q=isbn%3A'+i+'&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=subject&rows=1&output=json');const d=j&&j.response&&j.response.docs&&j.response.docs[0];return d?mk(arr(d.title)[0],arr(d.creator).join(', '),d.subject):null}),
    ...ids.map(i=>async()=>{const j=await J('https://api.crossref.org/works?filter=isbn:'+i+'&rows=1');const d=j&&j.message&&j.message.items&&j.message.items[0];return d&&d.title?mk(arr(d.title)[0],arr(d.author).map(a=>[a.given,a.family].filter(Boolean).join(' ')).join(', '),d.subject):null}),
    ...ids.map(i=>async()=>{const j=await J('https://catalog.hathitrust.org/api/volumes/brief/isbn/'+i+'.json');const r=j&&j.records&&Object.values(j.records)[0];return r&&r.titles&&r.titles[0]?mk(r.titles[0],'',[]):null})
  ];
  return new Promise(done=>{
    const got=[];let left=S.length,fin=false,tm=null;
    const end=()=>{if(fin)return;fin=true;clearTimeout(tm);clearTimeout(hard);ctl.abort();
      const rs=got.sort((x,y)=>x.idx-y.idx).map(x=>x.r);
      done(rs.length?{title:rs[0].title,author:(rs.find(x=>x.author)||{}).author||'',cat:(rs.find(x=>x.cat)||{}).cat||''}:null)};
    const hard=setTimeout(end,10000);
    S.forEach((f,idx)=>f().then(r=>{if(r){got.push({idx,r});if(!tm)tm=setTimeout(end,1500)}}).catch(()=>{}).finally(()=>{if(--left===0)end()}));
  })}
let retrying=false;
async function retryPending(){
  if(retrying||!navigator.onLine)return;retrying=true;
  for(const b of books.filter(x=>x.pending&&x.isbn)){
    const r=await lookup(b.isbn);
    if(r&&r.title&&b.pending){b.title=r.title;b.author=r.author||'';if(b.cat==='Uncategorised'&&cleanCat(r.cat))b.cat=cleanCat(r.cat);b.pending=false;persist();render()}
  }
  retrying=false}
window.addEventListener('online',retryPending);
function setWeb(){const i=$('isbn').value.replace(/[-\s]/g,'');$('webLook').hidden=!i;$('webLook').href='https://isbnsearch.org/isbn/'+i}
function showForm(isbn,skip){$('form').hidden=false;$('isbn').value=isbn||'';$('title').value='';$('author').value='';$('cat').value='';$('status').value='Unread';$('title').focus();setWeb();
  if(isbn&&skip){$('msg').textContent='Not found online (newer or regional books are often missing). Tap 🔎 below to look it up, then type the title. The ISBN is already saved.'}
  else if(isbn){$('msg').textContent='Scanned '+isbn+'. Looking up details…';
    lookup(isbn).then(r=>{if($('isbn').value!==isbn)return;
      if(r){if(!$('title').value)$('title').value=r.title||'';if(!$('author').value)$('author').value=r.author||'';if(!$('cat').value)$('cat').value=r.cat||'';$('msg').textContent='Details found. Check them, pick a category, then save.'}
      else $('msg').textContent='No online match (or you are offline). Type the details in.'})}}
const BTN='📷 Scan a book';let stream=null,loopOn=false;
const FAST={tryHarder:false,tryRotate:false,formats:['EAN-13'],maxNumberOfSymbols:1};
const OPTS={tryHarder:true,tryRotate:true,formats:['EAN-13'],maxNumberOfSymbols:1};
const zx=()=>window.ZXingWASM&&ZXingWASM.readBarcodes;
function pickIsbn(res){for(const r of res||[]){const t=(r.text||'').trim();if(validIsbn(t))return t}return null}
function cleanCat(c){return c&&c.length<=28&&!/accessible|protected|large type|in library|^nyt|^open library/i.test(c)?c:''}
async function found(t){
  if(books.some(b=>b.isbn===t)){$('msg').textContent='Already in your library ✔';return}
  $('msg').textContent='Got it! Looking up the book…';
  const r=await lookup(t);
  if(r&&r.title){books.unshift({id:Date.now(),isbn:t,title:r.title,author:r.author||'',cat:cleanCat(r.cat)||'Uncategorised',status:'Unread'});persist();render();
    $('msg').innerHTML='✅ Added: <b>'+esc(r.title)+'</b><br>Tap the category tag on the book to change it.';$('scanBtn').textContent='📷 Scan next book'}
  else{books.unshift({id:Date.now(),isbn:t,title:'Untitled ('+t+')',author:'',cat:'Uncategorised',status:'Unread',pending:true});persist();render();
    $('msg').innerHTML='📖 Saved! No free source knew this book yet. It will keep retrying. Tap the title ✎ to name it yourself.';$('scanBtn').textContent='📷 Scan next book'}}
function stopScan(){loopOn=false;clearTimeout(window.hintT);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').srcObject=null;$('reader').hidden=true;$('scanBtn').textContent=BTN}
$('scanBtn').onclick=async()=>{
  if(stream){stopScan();return}
  if(!zx()){$('msg').textContent='Scanner library did not load (needs internet on first use). Try Photo scan or add manually.';return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){stream=null;$('msg').textContent='Live camera is blocked here. Use Photo scan instead.';return}
  const v=$('vid');v.srcObject=stream;await v.play().catch(()=>{});
  try{const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.focusMode&&cap.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
  $('reader').hidden=false;$('scanBtn').textContent='Stop scanning';$('msg').textContent='Point the camera at the barcode on the back cover.';
  clearTimeout(window.hintT);window.hintT=setTimeout(()=>{if(stream)$('msg').textContent='Still looking… hold 10–15 cm away, keep it sharp and avoid glare. Or use Photo scan.'},8000);
  let nd=null;try{if('BarcodeDetector' in window)nd=new BarcodeDetector({formats:['ean_13']})}catch(_){}
  loopOn=true;const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let n=0;
  while(loopOn){
    if(v.videoWidth){
      try{
        let t=null;
        if(nd){try{t=pickIsbn((await nd.detect(v)).map(x=>({text:x.rawValue})))}catch(_){nd=null}}
        if(!nd&&!t){
          const heavy=(n++%4===3),vw=v.videoWidth,vh=v.videoHeight,sy=heavy?0:Math.round(vh*0.2),sh=heavy?vh:Math.round(vh*0.6);
          const sc=Math.min(1,(heavy?1100:800)/vw);cv.width=Math.round(vw*sc);cv.height=Math.round(sh*sc);
          cx.drawImage(v,0,sy,vw,sh,0,0,cv.width,cv.height);
          t=pickIsbn(await ZXingWASM.readBarcodes(cx.getImageData(0,0,cv.width,cv.height),heavy?OPTS:FAST));
        }
        if(t&&loopOn){stopScan();found(t);return}
      }catch(_){}
    }
    await new Promise(r=>setTimeout(r,30));
  }
};
$('photoBtn').onclick=()=>{stopScan();$('photo').value='';$('photo').click()};
async function loadBmp(f){
  try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}
  return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
function mk(bmp,maxW,rot,filt){
  const sc=Math.min(1,maxW/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const c=document.createElement('canvas');const r=rot%180;c.width=r?h:w;c.height=r?w:h;
  const x=c.getContext('2d');if(filt)x.filter='grayscale(1) contrast(1.6)';
  x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(bmp,-w/2,-h/2,w,h);
  return new Promise(ok=>c.toBlob(b=>ok(b),'image/jpeg',0.92))}
$('photo').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!zx()){$('msg').textContent='Scanner library did not load (needs internet on first use). Add manually.';return}
  $('msg').textContent='Reading barcode…';
  let t=null;
  try{
    t=pickIsbn(await ZXingWASM.readBarcodes(f,OPTS));
    if(!t){const bmp=await loadBmp(f);for(const w of [1600,900]){const blob=await mk(bmp,w,0,false);t=pickIsbn(await ZXingWASM.readBarcodes(blob,OPTS));if(t)break}}
  }catch(err){$('msg').textContent='Scanner could not run here (it needs to be hosted online). '+(err&&err.message||'');showForm('');return}
  if(!t){$('msg').textContent='No ISBN found. Retake with the barcode filling the frame, or type it in.';showForm('');return}
  found(t);
};
$('addBtn').onclick=()=>{stopScan();$('msg').textContent='';showForm('')};
$('cancel').onclick=()=>{$('form').hidden=true;$('msg').textContent=''};
$('save').onclick=()=>{
  const isbn=$('isbn').value.replace(/[-\s]/g,''),title=$('title').value.trim()||(isbn?'Untitled ('+isbn+')':'');
  if(!title){$('msg').textContent='Title is required.';return}
  if(isbn&&books.some(b=>b.isbn===isbn)){$('msg').textContent='That ISBN is already saved.';return}
  books.unshift({id:Date.now(),isbn,title,author:$('author').value.trim(),cat:$('cat').value.trim()||'Uncategorised',status:$('status').value});
  persist();$('form').hidden=true;$('msg').textContent='Saved ✓';render()
};
$('pasteT').onclick=async()=>{try{const t=(await navigator.clipboard.readText()).trim();if(t){$('title').value=t.slice(0,200);$('msg').textContent='Title pasted ✓'}else $('msg').textContent='Nothing copied yet.'}catch(e){$('msg').textContent='Paste not allowed. Long-press the title box and tap Paste.'}};
$('q').oninput=render;$('isbn').oninput=setWeb;
$('exp').onclick=()=>{const t=JSON.stringify(books,null,2);navigator.clipboard?.writeText(t).then(()=>$('msg').textContent='Library copied to clipboard as JSON.').catch(()=>$('msg').textContent='Copy not allowed here.')};

function chips(el,vals,cur,set){el.innerHTML=vals.map(v=>`<span class="chip ${v===cur?'on':''}" data-v="${esc(v)}">${esc(v)}</span>`).join('');
  el.onclick=e=>{const v=e.target.dataset.v;if(v!==undefined){set(v);render()}}}

function render(){
  $('count').textContent=books.length+(books.length==1?' book':' books');
  const cats=[...new Set(books.map(b=>b.cat))].sort();
  $('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  if(fCat!=='All'&&!cats.includes(fCat))fCat='All';
  chips($('catChips'),['All',...cats],fCat,v=>fCat=v);
  chips($('stChips'),['All','Unread','Reading','Read'],fSt,v=>fSt=v);
  const q=$('q').value.toLowerCase();
  const rows=books.filter(b=>(fCat==='All'||b.cat===fCat)&&(fSt==='All'||b.status===fSt)&&(!q||(b.title+b.author+b.isbn).toLowerCase().includes(q)));
  $('list').innerHTML=rows.length?rows.map(b=>`<div class="book"><button class="x" data-del="${b.id}" aria-label="Delete">×</button><b data-et="${b.id}" style="cursor:pointer">${esc(b.title)} ✎</b><span class="meta">${esc(b.author)||'Unknown author'}${b.isbn?' · '+esc(b.isbn):''}</span>${b.pending?`<br><a class="meta" target="_blank" rel="noopener" href="https://isbnsearch.org/isbn/${esc(b.isbn)}">🔎 Not found yet – look up manually</a>`:''}<br><span class="tag" data-ec="${b.id}" style="cursor:pointer">${esc(b.cat)} ✎</span><span class="tag" data-cy="${b.id}" style="cursor:pointer">${esc(b.status)} ↻</span></div>`).join(''):'<div class="empty">No books yet. Scan one to start.</div>';
}
$('list').onclick=e=>{
  const d=e.target.dataset.del,c=e.target.dataset.cy,ec=e.target.dataset.ec,et=e.target.dataset.et;
  if(et){const b=books.find(b=>b.id==et),v=prompt('Book title:',b.title);if(v&&v.trim()){b.title=v.trim();b.pending=false;persist();render()}}
  if(ec){const b=books.find(b=>b.id==ec),v=prompt('Category for this book:',b.cat);if(v&&v.trim()){b.cat=v.trim();persist();render()}}
  if(d){books=books.filter(b=>b.id!=d);persist();render()}
  if(c){const b=books.find(b=>b.id==c),s=['Unread','Reading','Read'];b.status=s[(s.indexOf(b.status)+1)%3];persist();render()}
};
render();
setTimeout(retryPending,2000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{try{if(zx())ZXingWASM.readBarcodes(new ImageData(8,8),FAST).catch(()=>{})}catch(_){}},300);
</script>
</body>
</html>
